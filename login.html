<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kajero | Login</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

    <div class="card login-card">

        <h1>Kajero</h1>

        <p class="subtitle">
            Accede a tu cuenta
        </p>

        <div class="input-group">
            <input
                id="user"
                type="text"
                placeholder="Usuario"
                autocomplete="off"
            >
        </div>

        <div class="input-group">
            <input
                id="pass"
                type="password"
                placeholder="Contraseña"
            >
        </div>

        <div class="button-group">
            <button
                type="button"
                onclick="login()"
            >
                Iniciar sesión
            </button>

            <button
                type="button"
                class="secondary-btn"
                onclick="register()"
            >
                Registrarse
            </button>
        </div>

    </div>

</div>

<script src="storage.js"></script>
<script src="app.js"></script>

</body>
</html>
